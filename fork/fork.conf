# basalt-u7265k-rtx5080: the fork's binary and config for the basalt user service.  fork/update.sh --deploy copies this
# to ~/.config/systemd/user/basalt.service.d/fork.conf; delete it there to go back to the unit's own ExecStart.
[Unit]
Description=Basalt fork basalt-u7265k-rtx5080: Qwen3.8-Flash-Next UD-Q4_K_XL (Unsloth Dynamic V3.1), 262K context, GPU vision (loopback :11000)

[Service]
WorkingDirectory=/home/carl/src/basalt-new
ExecStart=
ExecStart=/home/carl/src/basalt-new/bin-deployed/basalt serve --config /home/carl/src/basalt-new/fork/q4kxl.json --python /home/carl/src/basalt/.venv/bin/python
